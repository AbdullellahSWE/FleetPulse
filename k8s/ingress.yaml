apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleetpulse-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - http:
      paths:
      - path: /telemetry
        pathType: Prefix
        backend:
          service:
            name: telemetry-api
            port:
              number: 8000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: telemetry-api
            port:
              number: 8000