apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleetpulse-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - http:
      paths:
      - path: /ai(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: telemetry-api
            port:
              number: 8000
      - path: /telemetry(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: telemetry-api
            port:
              number: 8000
      - path: /health(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: telemetry-api
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fleetpulse-dashboard
            port:
              number: 80