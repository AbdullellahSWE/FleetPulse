apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-api
  namespace: default
  labels:
    app: telemetry-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemetry-api
  template:
    metadata:
      labels:
        app: telemetry-api
    spec:
      containers:
      - name: telemetry-api
        # ECR URI — matches buildspec.yml TELEMETRY_ECR_URI and telemetry-api.yaml
        image: 194163347210.dkr.ecr.us-east-1.amazonaws.com/fleetpulse-telemetry-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: openrouter-secret
              key: OPENROUTER_API_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: aurora-db-secret
              key: connection-string
        - name: SNS_ALERT_TOPIC_ARN
          valueFrom:
            secretKeyRef:
              name: sns-alert-secret
              key: SNS_ALERT_TOPIC_ARN
              optional: true   # pod still starts even if secret is absent (local dev)
        - name: AWS_REGION
          value: "us-east-1"
        - name: COGNITO_CLIENT_ID
          value: "60ljkjaia3u74terhhcto4n076"
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-api
  namespace: default
spec:
  selector:
    app: telemetry-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telemetry-api-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telemetry-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
