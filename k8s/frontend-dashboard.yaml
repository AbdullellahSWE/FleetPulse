apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetpulse-dashboard
  namespace: default
  labels:
    app: fleetpulse-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fleetpulse-dashboard
  template:
    metadata:
      labels:
        app: fleetpulse-dashboard
    spec:
      containers:
        - name: fleetpulse-dashboard
          image: 194163347210.dkr.ecr.us-east-1.amazonaws.com/fleetpulse/dashboard:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fleetpulse-dashboard
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: fleetpulse-dashboard