server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests directly to the Kubernetes telemetry-api service
    location /ai/ {
        proxy_pass http://telemetry-api.default.svc.cluster.local:8000/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health/ {
        proxy_pass http://telemetry-api.default.svc.cluster.local:8000/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
