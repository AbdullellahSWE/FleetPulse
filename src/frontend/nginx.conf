server {
    listen 80;
    server_name localhost;

    # Define Kubernetes internal DNS resolver
    resolver 10.96.0.10 valid=30s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy AI requests directly to the Kubernetes telemetry-api service
    location /ai/ {
        set $backend_upstream http://telemetry-api.default.svc.cluster.local:8000;
        proxy_pass $backend_upstream/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        set $backend_upstream http://telemetry-api.default.svc.cluster.local:8000;
        proxy_pass $backend_upstream/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}