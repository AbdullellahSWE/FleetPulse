server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy AI requests
    location /ai/ {
        proxy_pass http://telemetry-api.default.svc.cluster.local:8000/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Telemetry and SNS alert requests
    location /telemetry/ {
        proxy_pass http://telemetry-api.default.svc.cluster.local:8000/telemetry/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://telemetry-api.default.svc.cluster.local:8000/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}