version: 0.2

# Build stage: test -> build (immutable commit-SHA tags) -> push SHA tags -> ECR scan gate -> promote :latest
env:
  variables:
    DOCKER_BUILDKIT: "0"   # classic builder: ECR basic scanning cannot scan BuildKit OCI index manifests
  exported-variables:
    - IMAGE_TAG

phases:
  install:
    runtime-versions:
      python: 3.11
      nodejs: 20
    commands:
      - pip install -q -r requirements-dev.txt
  pre_build:
    commands:
      - REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - ACCOUNT_ID=${AWS_ACCOUNT_ID:-$(aws sts get-caller-identity --query Account --output text)}
      - REGISTRY=$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com
      - aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY
      - IMAGE_TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-12)
      - test -n "$IMAGE_TAG" || { echo "Cannot determine commit SHA for image tag"; exit 1; }
      - export IMAGE_TAG
      - TELEMETRY_REPO=fleetpulse-telemetry-api
      - DASHBOARD_REPO=fleetpulse/dashboard
      - DISPATCH_REPO=fleetpulse-dispatch-service
      - echo "Building commit $IMAGE_TAG"
      - echo "Running API unit tests"
      - python -m pytest tests/unit/test_telemetry_api.py -q -p no:cacheprovider
  build:
    commands:
      - docker build -t $REGISTRY/$TELEMETRY_REPO:$IMAGE_TAG ./src/telemetry-api
      - docker build -t $REGISTRY/$DISPATCH_REPO:$IMAGE_TAG ./src/dispatch-service
      - docker build -t $REGISTRY/$DASHBOARD_REPO:$IMAGE_TAG ./src/frontend
  post_build:
    commands:
      - echo "Pushing immutable SHA tags"
      - docker push $REGISTRY/$TELEMETRY_REPO:$IMAGE_TAG
      - docker push $REGISTRY/$DISPATCH_REPO:$IMAGE_TAG
      - docker push $REGISTRY/$DASHBOARD_REPO:$IMAGE_TAG
      - echo "Security gate - a failing scan stops the pipeline before :latest moves and before deploy"
      - python scripts/ci/ecr_scan_gate.py $TELEMETRY_REPO $IMAGE_TAG $REGION
      - python scripts/ci/ecr_scan_gate.py $DISPATCH_REPO $IMAGE_TAG $REGION
      - python scripts/ci/ecr_scan_gate.py $DASHBOARD_REPO $IMAGE_TAG $REGION
      - echo "Gate passed - promoting :latest"
      - |
        for repo in $TELEMETRY_REPO $DISPATCH_REPO $DASHBOARD_REPO; do
          docker tag $REGISTRY/$repo:$IMAGE_TAG $REGISTRY/$repo:latest
          docker push $REGISTRY/$repo:latest
        done
